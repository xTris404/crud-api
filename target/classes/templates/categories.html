<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Category CRUD - AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Spring Boot CRUD</a>
        <div class="navbar-nav">
            <a class="nav-link active" href="/categories">Categories</a>
            <a class="nav-link" href="/products">Products</a>
            <a class="nav-link" href="/swagger-ui.html" target="_blank">Swagger</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-tags"></i> Quản lý Category</h2>
        <button class="btn btn-success" onclick="showCreateModal()">
            <i class="fas fa-plus"></i> Thêm Category
        </button>
    </div>

    <table class="table table-striped table-hover" id="categoryTable">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Icon</th>
                <th>Tên Category</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- Modal Add -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="addForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Tên Category</label>
                        <input type="text" class="form-control" name="categoryName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Icon</label>
                        <input type="file" class="form-control" name="icon" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Thêm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Edit -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="editForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="categoryId" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Tên Category</label>
                        <input type="text" class="form-control" name="categoryName" id="editName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Icon (để trống nếu không đổi)</label>
                        <input type="file" class="form-control" name="icon" accept="image/*">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const createModal = new bootstrap.Modal(document.getElementById('createModal'));
const editModal = new bootstrap.Modal(document.getElementById('editModal'));

function loadCategories() {
    $.getJSON('/api/category', function(res) {
        const data = res.body || res;
        let html = '';
        data.forEach(item => {
            const img = item.icon ? `<img src="/images/${item.icon}" style="width:60px;height:60px;object-fit:cover" class="rounded">` : '-';
            html += `<tr>
                <td>${item.categoryId}</td>
                <td>${img}</td>
                <td>${item.categoryName}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="showEdit(${item.categoryId}, '${item.categoryName.replace(/'/g, "\\'")}')">
                        <i class="fa fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteCategory(${item.categoryId})">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>`;
        });
        $('#categoryTable tbody').html(html);
    });
}

function showCreateModal() {
    $('#addForm')[0].reset();
    createModal.show();
}

function showEdit(id, name) {
    $('#editId').val(id);
    $('#editName').val(name);
    editModal.show();
}

$('#addForm').submit(function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    $.ajax({
        url: '/api/category/addCategory',
        type: 'POST',
        data: formData,
        contentType: false,
        processData: false,
        success: function(res) {
            if (res.status) {
                createModal.hide();
                loadCategories();
                alert(res.message);
            } else {
                alert(res.message || 'Lỗi');
            }
        },
        error: function(xhr) {
            alert(xhr.responseJSON?.message || 'Lỗi khi thêm');
        }
    });
});

$('#editForm').submit(function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    $.ajax({
        url: '/api/category/updateCategory',
        type: 'PUT',
        data: formData,
        contentType: false,
        processData: false,
        success: function(res) {
            if (res.status) {
                editModal.hide();
                loadCategories();
                alert(res.message);
            } else {
                alert(res.message || 'Lỗi');
            }
        },
        error: function(xhr) {
            alert(xhr.responseJSON?.message || 'Lỗi khi cập nhật');
        }
    });
});

function deleteCategory(id) {
    if (!confirm('Bạn có chắc muốn xóa Category này?')) return;
    $.ajax({
        url: '/api/category/deleteCategory?categoryId=' + id,
        type: 'DELETE',
        success: function(res) {
            loadCategories();
            alert(res.message || 'Đã xóa');
        },
        error: function() {
            alert('Lỗi khi xóa');
        }
    });
}

$(document).ready(loadCategories);
</script>
</body>
</html>
