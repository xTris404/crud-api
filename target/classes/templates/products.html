<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product CRUD - AJAX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Spring Boot CRUD</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/categories">Categories</a>
            <a class="nav-link active" href="/products">Products</a>
            <a class="nav-link" href="/swagger-ui.html" target="_blank">Swagger</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="fas fa-box"></i> Quản lý Product</h2>
        <button class="btn btn-success" onclick="showCreateModal()">
            <i class="fas fa-plus"></i> Thêm Product
        </button>
    </div>

    <table class="table table-striped table-hover" id="productTable">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Ảnh</th>
                <th>Tên SP</th>
                <th>Giá</th>
                <th>SL</th>
                <th>Category</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>

<!-- Modal Add -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="addForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tên sản phẩm</label>
                            <input type="text" class="form-control" name="productName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="categoryId" id="addCategorySelect" required></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Giá (unitPrice)</label>
                            <input type="number" step="0.01" class="form-control" name="unitPrice" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Discount</label>
                            <input type="number" step="0.01" class="form-control" name="discount" value="0" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Số lượng</label>
                            <input type="number" class="form-control" name="quantity" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status (0/1)</label>
                            <input type="number" class="form-control" name="status" value="1" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ảnh</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" name="description" rows="2" required></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Thêm</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal Edit -->
<div class="modal fade" id="editModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="editForm" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Cập nhật Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="productId" id="editId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Tên sản phẩm</label>
                            <input type="text" class="form-control" name="productName" id="editName" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" name="categoryId" id="editCategorySelect" required></select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Giá</label>
                            <input type="number" step="0.01" class="form-control" name="unitPrice" id="editPrice" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Discount</label>
                            <input type="number" step="0.01" class="form-control" name="discount" id="editDiscount" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Số lượng</label>
                            <input type="number" class="form-control" name="quantity" id="editQty" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Status</label>
                            <input type="number" class="form-control" name="status" id="editStatus" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ảnh (để trống nếu không đổi)</label>
                            <input type="file" class="form-control" name="imageFile" accept="image/*">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Mô tả</label>
                            <textarea class="form-control" name="description" id="editDesc" rows="2" required></textarea>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                    <button type="submit" class="btn btn-primary">Cập nhật</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const createModal = new bootstrap.Modal(document.getElementById('createModal'));
const editModal = new bootstrap.Modal(document.getElementById('editModal'));
let categories = [];

function loadCategoriesForSelect() {
    $.getJSON('/api/category', function(res) {
        categories = res.body || res;
        let opts = '<option value="">-- Chọn Category --</option>';
        categories.forEach(c => {
            opts += `<option value="${c.categoryId}">${c.categoryName}</option>`;
        });
        $('#addCategorySelect, #editCategorySelect').html(opts);
    });
}

function loadProducts() {
    $.getJSON('/api/product', function(res) {
        const data = res.body || res;
        let html = '';
        data.forEach(p => {
            const img = p.images ? `<img src="/images/${p.images}" style="width:50px;height:50px;object-fit:cover" class="rounded">` : '-';
            const cateName = p.category ? p.category.categoryName : '-';
            html += `<tr>
                <td>${p.productId}</td>
                <td>${img}</td>
                <td>${p.productName}</td>
                <td>${p.unitPrice}</td>
                <td>${p.quantity}</td>
                <td>${cateName}</td>
                <td>${p.status}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick='showEdit(${JSON.stringify(p)})'>
                        <i class="fa fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.productId})">
                        <i class="fa fa-trash"></i>
                    </button>
                </td>
            </tr>`;
        });
        $('#productTable tbody').html(html);
    });
}

function showCreateModal() {
    $('#addForm')[0].reset();
    createModal.show();
}

function showEdit(p) {
    $('#editId').val(p.productId);
    $('#editName').val(p.productName);
    $('#editPrice').val(p.unitPrice);
    $('#editDiscount').val(p.discount);
    $('#editQty').val(p.quantity);
    $('#editStatus').val(p.status);
    $('#editDesc').val(p.description);
    if (p.category) {
        $('#editCategorySelect').val(p.category.categoryId);
    }
    editModal.show();
}

$('#addForm').submit(function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    $.ajax({
        url: '/api/product/addProduct',
        type: 'POST',
        data: formData,
        contentType: false,
        processData: false,
        success: function(res) {
            if (res.status) {
                createModal.hide();
                loadProducts();
                alert(res.message);
            } else {
                alert(res.message || 'Lỗi');
            }
        },
        error: function(xhr) {
            alert(xhr.responseJSON?.message || 'Lỗi khi thêm');
        }
    });
});

$('#editForm').submit(function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    $.ajax({
        url: '/api/product/updateProduct',
        type: 'PUT',
        data: formData,
        contentType: false,
        processData: false,
        success: function(res) {
            if (res.status) {
                editModal.hide();
                loadProducts();
                alert(res.message);
            } else {
                alert(res.message || 'Lỗi');
            }
        },
        error: function(xhr) {
            alert(xhr.responseJSON?.message || 'Lỗi khi cập nhật');
        }
    });
});

function deleteProduct(id) {
    if (!confirm('Bạn có chắc muốn xóa Product này?')) return;
    $.ajax({
        url: '/api/product/deleteProduct?productId=' + id,
        type: 'DELETE',
        success: function(res) {
            loadProducts();
            alert(res.message || 'Đã xóa');
        },
        error: function() {
            alert('Lỗi khi xóa');
        }
    });
}

$(document).ready(function() {
    loadCategoriesForSelect();
    loadProducts();
});
</script>
</body>
</html>
